[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transit-heat"
version = "1.0.0"
description = "Pedestrian-scale transit station heat exposure and walkshed microclimate analysis across NYC, Chicago, and Washington D.C."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Urban Climate and Environmental Equity Research Team" }
]
keywords = [
    "urban-heat-island",
    "landsat",
    "surface-temperature",
    "pedestrian-walksheds",
    "osmnx",
    "transit-equity",
    "microclimate"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Atmospheric Science"
]
dependencies = [
    "geopandas>=0.14.0",
    "rasterio>=1.3.0",
    "rioxarray>=0.15.0",
    "xarray>=2023.0.0",
    "shapely>=2.0.0",
    "cartopy>=0.22.0",
    "rasterstats>=0.19.0",
    "pyproj>=3.6.0",
    "osmnx>=1.8.0",
    "networkx>=3.2.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "tqdm>=4.66.0"
]

[project.optional-dependencies]
census = [
    "census>=0.8.0",
    "us>=3.0.0"
]
visualization = [
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "folium>=0.15.0",
    "branca>=0.7.0"
]

[project.scripts]
transit-heat = "main:main"

[tool.setuptools.packages.find]
include = ["transit_heat*"]
